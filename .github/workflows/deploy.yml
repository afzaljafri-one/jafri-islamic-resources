name: Jafri Sacred Audio Library — Build & Gated Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_approval:
        description: 'Type "APPROVE_RELEASE" to authorize live deployment to GitHub Pages'
        required: true
        default: 'DRY_RUN'

# Workflow-level least-privilege default
permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # ============================================================================
  # STAGE 1: AUTOMATED VALIDATION (Runs on ALL pushes & PRs)
  # Scoped strictly to contents: read. Cannot publish or access Pages API.
  # ============================================================================
  validate-build:
    name: Type-Check & Build Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Locked Dependencies
        run: npm ci

      - name: Run TypeScript Type-Check (tsc -b)
        run: npx tsc -b

      - name: Generate and Validate Reconciled Corpus Inventory
        run: node scripts/generate_phase6_3_5_corpus_inventory.cjs

      - name: Run Phase 6.3.4 Data & Rights Gate Validator
        run: node test_phase6_3_4_rights_gate.cjs

      - name: Compile Vite Production Bundle
        run: npx vite build
        env:
          VITE_BASE_PATH: '/jafri-islamic-resources/'

      - name: Scan Production Bundle for Restricted Strings
        run: node scripts/scan_production_bundle_rights.cjs

      - name: Run Phase 6.3.5 Final Rights Enforcement & Corpus Reconciliation Gate
        run: node test_phase6_3_5_data_rights_gate.cjs

      - name: Run Phase 6.3.5.2 Browser Acceptance Suite
        run: node --experimental-websocket test_phase6_3_5_2_acceptance.cjs
        env:
          CHROME_BIN: /usr/bin/google-chrome

      # upload-pages-artifact creates the static tarball without needing configure-pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # ============================================================================
  # STAGE 2: PRODUCTION DEPLOYMENT (STRICTLY MANUALLY GATED)
  # Ordinary pushes and PRs NEVER execute this job
  # ============================================================================
  deploy-production:
    name: Deploy to GitHub Pages (Manual Release Gate)
    needs: validate-build
    # Gate 1: Push to main OR manual dispatch with exact passphrase check
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_approval == 'APPROVE_RELEASE')
    # Gate 2: GitHub Environment required reviewer sign-off
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Elevated permissions restricted solely to the deploy job
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages Configuration
        uses: actions/configure-pages@v5

      - name: Publish Artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Live Smoke Test Verification
        run: |
          echo "Verifying live production deployment on GitHub Pages..."
          for i in {1..6}; do
            echo "Checking deployment attempt $i/6..."
            PAGE_HTML=$(curl -f -s -L https://afzaljafri-one.github.io/jafri-islamic-resources/ || true)
            if echo "$PAGE_HTML" | grep -q "Jafri Sacred Library"; then
              echo "✓ Live smoke test passed: Production site is serving current release."
              exit 0
            fi
            echo "Waiting 10s for CDN edge cache propagation..."
            sleep 10
          done
          echo "✗ Live smoke test failed to verify production site within timeout."
          exit 1

      - name: Checkout Source Code for Live Production Acceptance Suite
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Phase 6.3.5.2 Live Production Acceptance Suite
        run: node --experimental-websocket test_phase6_3_5_2_prod_live.cjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
